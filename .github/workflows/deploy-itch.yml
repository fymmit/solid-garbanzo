name: Deploy to itch.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish WebAssembly build
        run: dotnet publish src/Game/Game.csproj -c Release -r browser-wasm --self-contained

      - name: Install Butler
        run: |
          curl --fail --location --output butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler/butler push --if-changed \
            src/Game/bin/Release/net10.0/browser-wasm/AppBundle \
            fymmit/solid-garbanzo:html5
